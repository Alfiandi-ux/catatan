plugins {
    id 'com.android.application'
}

// Aset web (PWA) berada di akar repositori dan disalin ke assets/www saat build.
def webRoot = rootProject.projectDir.parentFile
def stageRoot = layout.buildDirectory.dir("staged-assets")

tasks.register("stageWeb", Copy) {
    from(webRoot) {
        include "index.html"
        include "manifest.webmanifest"
        include "sw.js"
        include "icon*.png"
        include "icon*.svg"
        include "assets/**"
        exclude "assets/**/*.map"
    }
    into stageRoot.map { it.dir("www") }
}

android {
    namespace "id.catatan.app"
    compileSdk 34

    defaultConfig {
        applicationId "id.catatan.app"
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName "1.0.1"
    }

    signingConfigs {
        release {
            storeFile file("../release.keystore")
            storePassword "catatan"
            keyAlias "catatan"
            keyPassword "catatan"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main {
            assets.srcDirs += [stageRoot.get().asFile]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

tasks.named("preBuild").configure { dependsOn("stageWeb") }
